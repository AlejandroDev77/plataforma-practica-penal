[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis-penal-intelligence"
version = "0.1.0"
description = "Procesamiento documental, recuperación jurídica y agentes de simulación."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
retrieval = [
    "asyncpg>=0.30,<1",
    "pgvector>=0.4,<1",
    "sqlalchemy[asyncio]>=2,<3",
]
documents = [
    "pymupdf>=1.25,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
]
openai = ["openai>=2,<3"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
